name: Release & Multiplatform Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Arch Linux Package (.pkg.tar.zst, standalone binary & portable tar.gz)
  build-arch-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update system & install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel nodejs npm rust git webkit2gtk-4.1 libsoup3 gtk3 mpv pkgconf meson vala gobject-introspection glib-networking
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory "*"
          
          # Install libsoup (2.4) from AUR for soup2-sys compatibility (skip tests in CI container)
          su builder -c "git clone https://aur.archlinux.org/libsoup.git /tmp/libsoup && cd /tmp/libsoup && makepkg -si --noconfirm --nocheck"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Web Frontend & Tauri Binary
        run: |
          npm install --include=optional
          npm run build
          cd src-tauri
          cargo build --release

      - name: Package Arch Linux .pkg.tar.zst
        run: |
          chown -R builder:builder aur
          su builder -c "cd aur && makepkg -s --noconfirm --nodeps --nocheck"
          mkdir -p /tmp/dist-arch
          cp aur/*.pkg.tar.zst /tmp/dist-arch/ || true
          cp src-tauri/target/release/yozora /tmp/dist-arch/yozora-linux-x86_64
          
          # Create portable tarball bundle
          mkdir -p /tmp/yozora-bundle
          cp src-tauri/target/release/yozora /tmp/yozora-bundle/yozora
          cp aur/yozora.desktop /tmp/yozora-bundle/
          cp public/logo.svg /tmp/yozora-bundle/yozora.svg
          cp install.sh /tmp/yozora-bundle/
          tar -czf /tmp/dist-arch/yozora-linux-x86_64.tar.gz -C /tmp/yozora-bundle .
          chmod -R 777 /tmp/dist-arch

      - name: Upload Arch & Standalone Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yozora-arch-linux-artifacts
          path: /tmp/dist-arch/*

  # 2. Build Universal AppImage & Debian/Ubuntu Package (.deb)
  build-deb-and-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev libsoup2.4-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install dependencies & build frontend
        run: |
          npm install --include=optional
          chmod -R +x node_modules/.bin 2>/dev/null || true
          npm run build

      - name: Build Tauri Bundles (AppImage & DEB)
        run: |
          npx @tauri-apps/cli@1 build

      - name: Prepare Debian and AppImage artifacts
        run: |
          mkdir -p dist-bundles
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} dist-bundles/ \; || true
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist-bundles/yozora-linux-x86_64.AppImage \; || true

      - name: Upload DEB & AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yozora-deb-appimage-artifacts
          path: dist-bundles/*

  # 3. Build Windows Executables (.exe standalone & setup installers)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & build frontend
        shell: bash
        run: |
          npm install --include=optional
          npm install @rollup/rollup-win32-x64-msvc --no-save
          npm run build

      - name: Build Windows release binary
        run: |
          cd src-tauri
          cargo build --release

      - name: Build Tauri Windows Bundles & Installers
        run: |
          npx @tauri-apps/cli@1 build
        continue-on-error: true

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win
          # Standalone executable
          if (Test-Path "src-tauri/target/release/yozora.exe") {
            Copy-Item "src-tauri/target/release/yozora.exe" -Destination "dist-win/yozora-windows-x64.exe"
          }
          # NSIS installer exe
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | ForEach-Object {
              Copy-Item $_.FullName -Destination "dist-win/$($_.Name)"
            }
          }
          # MSI installer
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | ForEach-Object {
              Copy-Item $_.FullName -Destination "dist-win/$($_.Name)"
            }
          }
          Get-ChildItem dist-win

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yozora-windows-artifacts
          path: dist-win/*

  # 4. Create GitHub Release & Publish All Multiplatform Artifacts
  publish-release:
    needs: [build-arch-linux, build-deb-and-appimage, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten and generate SHA256 checksums
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Multiplatform Release (Windows & Linux)' }}
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
